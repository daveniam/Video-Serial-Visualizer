name: Feature request
description: Suggest something the app should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Issues are welcome in English or Spanish — whichever you prefer.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the situation rather than the solution. Knowing what you're actually trying to
        accomplish often leads somewhere better than the feature you had in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to see
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead
      description: Workarounds you're using today, or other apps that get this right.
